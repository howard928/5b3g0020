<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的畫作</title>
    <style>
        /* 全域重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f0f0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            padding: 20px;
        }

        .card {
            background: #1a1a1a;
            max-width: 820px;
            width: 100%;
            border-radius: 24px;
            padding: 30px 30px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            transition: all 0.3s ease;
        }

        /* 畫作標題 */
        .card h1 {
            color: #f0ece4;
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }

        .card .sub {
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 18px;
        }

        /* 圖片區 - 讓畫作完整呈現 */
        .artwork {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #0a0a0a;
            margin-bottom: 28px;
            box-shadow: inset 0 0 0 1px #2a2a2a;
        }

        .artwork img {
            display: block;
            width: 100%;
            height: auto;
            /* 讓圖片保持原始比例，不裁切 */
            object-fit: contain;
            transition: transform 0.4s ease;
        }

        /* 滑鼠移上去微微放大，增加互動感 */
        .artwork img:hover {
            transform: scale(1.01);
        }

        /* ─── 下載按鈕 ─── */
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            color: #111;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.06);
            letter-spacing: 0.5px;
        }

        .download-btn:hover {
            background: #e8e4dc;
            transform: scale(1.03);
            box-shadow: 0 8px 35px rgba(255, 255, 255, 0.12);
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        /* 按鈕裡的小圖示（用文字代替） */
        .download-btn .icon {
            font-size: 22px;
            line-height: 1;
        }

        /* 簡易版權文字 */
        .footer-note {
            color: #444;
            font-size: 12px;
            margin-top: 22px;
            letter-spacing: 0.5px;
        }

        /* 手機版微調 */
        @media (max-width: 500px) {
            .card {
                padding: 18px 18px 30px;
            }
            .card h1 {
                font-size: 20px;
            }
            .download-btn {
                padding: 14px 32px;
                font-size: 16px;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 標題區 -->
        <h1>漂亮的小可愛9/1完成</h1>
        <div class="sub">——2026/9/10 生日快樂 ——</div>

        <!-- 你的畫作 -->
        <div class="artwork">
            <!-- ★★★ 重點：把這裡換成你的圖片檔案名稱 ★★★ -->
            <img src="le le_0_0.jpg" alt="我的畫作">
        </div>

        <!-- 下載按鈕（點擊即下載） -->
        <a href="le le_0_0.jpg" download="我的畫作.jpg" class="download-btn">
            <span class="icon">⬇</span> 下載原圖
        </a>

        <div class="footer-note">點擊即可下載 · 高畫質原檔</div>
    </div>

</body>
</html>
